<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tyre Warranty — Desktop Opener</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Helvetica Neue',Arial,sans-serif;background:#f5f5f5;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.layout{display:flex;gap:20px;max-width:860px;width:100%;align-items:stretch}
.card{background:white;border-radius:16px;padding:28px;box-shadow:0 4px 24px rgba(0,0,0,0.1)}
.control-card{flex:1;min-width:320px;text-align:center}
.checklist-card{flex:1.2;min-width:340px;text-align:left;display:flex;flex-direction:column}
.logo{width:64px;height:64px;border-radius:50%;background:#ffe5e5;display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 14px}
h1{font-size:19px;font-weight:700;color:#1a0000;margin-bottom:5px;text-align:center}
.sub{font-size:12px;color:#888;margin-bottom:20px;text-align:center}
.status-box{background:#f5f5f5;border-radius:12px;padding:14px;margin-bottom:18px}
.status-dot{width:11px;height:11px;border-radius:50%;background:#22c55e;display:inline-block;margin-right:8px;animation:pulse 1s ease-in-out infinite;vertical-align:middle}
.status-dot.idle{background:#94a3b8;animation:none}
.status-dot.error{background:#ef4444;animation:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.status-text{font-size:13px;color:#333;font-weight:500;vertical-align:middle}
.log{background:#1a1a1a;border-radius:8px;padding:10px;text-align:left;max-height:110px;overflow-y:auto;margin-bottom:18px}
.log-line{font-size:11px;color:#4ade80;font-family:monospace;line-height:1.6}
.log-line.err{color:#f87171}
.log-line.info{color:#93c5fd}
.btn{background:#b40000;color:white;border:none;border-radius:10px;padding:12px 24px;font-size:14px;font-weight:600;cursor:pointer;width:100%;margin-bottom:8px}
.btn:hover{background:#cc0000}
.btn:disabled{background:#ccc;cursor:not-allowed}
.btn-outline{background:white;color:#b40000;border:2px solid #b40000;border-radius:10px;padding:10px 24px;font-size:13px;font-weight:600;cursor:pointer;width:100%}
/* ── Checklist (the "area left") — every auto-opened form gets logged
     here permanently so it survives an accidentally-closed tab. Staff
     manually ticks each one done after finishing the actual submission
     on the external site; nothing here is auto-detected. ── */
.checklist-title{font-size:13px;font-weight:700;color:#1a0000;margin-bottom:4px}
.checklist-sub{font-size:11px;color:#aaa;margin-bottom:14px}
.checklist-empty{color:#aaa;font-size:13px;text-align:center;padding:32px 8px;flex:1;display:flex;align-items:center;justify-content:center}
.checklist-items{flex:1;overflow-y:auto;max-height:420px}
.check-item{border:1.5px solid #eee;border-radius:10px;padding:12px 14px;margin-bottom:10px}
.check-item-brand{font-size:14px;font-weight:700;color:#1a0000}
.check-item-sub{font-size:11px;color:#888;margin-top:2px}
.check-item-actions{display:flex;gap:8px;margin-top:8px}
.check-item-actions button{background:none;border:1px solid #ddd;border-radius:6px;padding:5px 10px;font-size:11px;color:#666;cursor:pointer;font-family:inherit}
.check-item-actions button:hover{background:#f5f5f5}
</style>
</head>
<body>
<div class="layout">

  <!-- LEFT: controls, status, connection log -->
  <div class="card control-card">
    <div class="logo">🖥️</div>
    <h1>Desktop Opener</h1>
    <div class="sub">Tyre Warranty — B.N. Tires &amp; Max<br>เปิดหน้านี้ทิ้งไว้บนคอมพิวเตอร์</div>

    <div class="status-box">
      <span class="status-dot idle" id="status-dot"></span>
      <span class="status-text" id="status-text">กดเริ่มเพื่อเริ่มรับฟอร์ม</span>
    </div>

    <div class="log" id="log"></div>

    <button class="btn" id="start-btn" onclick="startListening()">▶ เริ่มรับฟอร์มจากโทรศัพท์</button>
    <button class="btn-outline" id="stop-btn" onclick="stopListening()" disabled>⏹ หยุด</button>
  </div>

  <!-- RIGHT: persistent checklist of every form opened this session —
       survives an accidentally-closed tab, lets staff verify which
       car/brand it was and tick it off once actually submitted. -->
  <div class="card checklist-card">
    <div class="checklist-title">รายการที่เปิดวันนี้</div>
    <div class="checklist-sub">ถ้าเผลอปิดแท็บ กด "เปิดอีกครั้ง" เพื่อเปิดฟอร์มเดิมได้</div>
    <div id="checklist-body">
      <div class="checklist-empty">ยังไม่มีฟอร์มที่เปิด</div>
    </div>
  </div>

</div>

<script src="https://bntires.github.io/Member_Scanner/gas-urls.js?v=2"></script>
<script src="config.js"></script>
<script>
// ══ CONFIG ══
var GAS_API_URL   = GAS_URLS.warrantyApi;
var POLL_INTERVAL = CONFIG.POLL_INTERVAL_MS;

var pollTimer   = null;
var isListening = false;
var openHistory = []; // { carId, brand, url, time, done }

// ── Friendly brand name from the form's domain — shown in the
//    checklist instead of (or alongside) the raw URL. ──
var BRAND_DOMAIN_MAP = [
  { match: "llit-eservice.com/register/year/atlas",       name: "Atlas" },
  { match: "llit-eservice.com/register/quality/linglong", name: "Linglong" },
  { match: "contitcp.com",      name: "Continental" },
  { match: "toyotires.in.th",   name: "Toyo" },
  { match: "nittotire.in.th",   name: "Nitto" },
  { match: "advancetyre.in.th", name: "Advance" },
  { match: "nankangtire.in.th", name: "Nankang" },
  { match: "lensotires.com",    name: "Lenso" },
  { match: "giti.co.th",        name: "Giti" }
];
function _brandNameFromUrl(url){
  var lower = String(url||"").toLowerCase();
  for (var i=0; i<BRAND_DOMAIN_MAP.length; i++){
    if (lower.indexOf(BRAND_DOMAIN_MAP[i].match) !== -1) return BRAND_DOMAIN_MAP[i].name;
  }
  return "ฟอร์มลงทะเบียน";
}

function log(msg, type) {
  var div = document.getElementById("log");
  var line = document.createElement("div");
  line.className = "log-line " + (type||"");
  var time = new Date().toLocaleTimeString("th-TH");
  line.textContent = "["+time+"] "+msg;
  div.appendChild(line);
  div.scrollTop = div.scrollHeight;
}

function setStatus(msg, state) {
  document.getElementById("status-text").textContent = msg;
  var dot = document.getElementById("status-dot");
  dot.className = "status-dot " + (state||"");
}

function jsonp(url, onSuccess, onError) {
  var cb = "cb_"+Date.now();
  var s  = document.createElement("script");
  var done = false;
  var t  = setTimeout(function(){
    if(done) return;
    done = true;
    delete window[cb];
    if(s.parentNode) document.body.removeChild(s);
    if(onError) onError("timeout after 30s");
  }, 30000);
  window[cb] = function(r){
    if(done) return;
    done = true;
    clearTimeout(t);
    delete window[cb];
    if(s.parentNode) document.body.removeChild(s);
    onSuccess(r);
  };
  s.src = url + (url.indexOf("?")>=0?"&":"?") + "callback="+cb;
  s.onerror = function(){
    if(done) return;
    done = true;
    clearTimeout(t);
    delete window[cb];
    if(s.parentNode) document.body.removeChild(s);
    // Retry once on script error
    setTimeout(function(){
      jsonp(url, onSuccess, onError);
    }, 1000);
  };
  document.body.appendChild(s);
}

function startListening() {
  if(isListening) return;
  isListening = true;
  document.getElementById("start-btn").disabled = true;
  document.getElementById("stop-btn").disabled  = false;
  setStatus("กำลังรอฟอร์มจากโทรศัพท์...", "");
  log("เริ่มรับฟอร์ม — รอโทรศัพท์ส่งข้อมูล", "info");
  poll();
  pollTimer = setInterval(poll, POLL_INTERVAL);
}

function stopListening() {
  isListening = false;
  clearInterval(pollTimer);
  document.getElementById("start-btn").disabled = false;
  document.getElementById("stop-btn").disabled  = true;
  setStatus("หยุดรับฟอร์มแล้ว", "idle");
  log("หยุดรับฟอร์ม");
}

var errorCount = 0;
function poll() {
  jsonp(
    GAS_API_URL + "?action=popUrl",
    function(result) {
      errorCount = 0;
      if(result.ok && result.url) {
        handleNewUrl(result.url, result.carId);
      }
      // Silent success - no log needed when nothing pending
    },
    function(err) {
      errorCount++;
      if(errorCount <= 2 || errorCount % 10 === 0) {
        log("เชื่อมต่อ GAS ไม่ได้ ("+errorCount+"x): "+err, "err");
      }
    }
  );
}

// ── Auto-opens the form (back to original behavior) AND logs it
//    permanently into the checklist on the right, so if the tab gets
//    closed by accident there's still a record of exactly which
//    car/brand it was — with a button to reopen it directly. ──
function handleNewUrl(url, carId) {
  var brand = _brandNameFromUrl(url);
  log("📋 ได้รับฟอร์มสำหรับ: "+(carId||"unknown")+" ("+brand+")", "info");
  setStatus("กำลังเปิดฟอร์ม — "+carId, "");

  window.open(url, "_blank");

  jsonp(
    GAS_API_URL + "?action=confirmOpened&carId="+encodeURIComponent(carId||""),
    function(r) {
      log("✅ แจ้งโทรศัพท์สำเร็จ", "");
      setStatus("กำลังรอฟอร์มถัดไป...", "");
    },
    function(err){ log("แจ้งโทรศัพท์ไม่ได้: "+err, "err"); }
  );

  openHistory.unshift({ carId: carId, brand: brand, url: url, time: new Date().toLocaleTimeString("th-TH") });
  renderChecklist();
}

function renderChecklist() {
  var body = document.getElementById("checklist-body");
  if (!openHistory.length) {
    body.innerHTML = '<div class="checklist-empty">ยังไม่มีฟอร์มที่เปิด</div>';
    return;
  }
  var html = '<div class="checklist-items">';
  openHistory.forEach(function(h, idx) {
    html +=
      '<div class="check-item">'+
        '<div class="check-item-brand">'+h.brand+'</div>'+
        '<div class="check-item-sub">CarID: '+h.carId+' · '+h.time+'</div>'+
        '<div class="check-item-actions">'+
          '<button onclick="reopenForm('+idx+')">🔗 เปิดอีกครั้ง</button>'+
        '</div>'+
      '</div>';
  });
  html += '</div>';
  body.innerHTML = html;
}

function reopenForm(idx) {
  if (!openHistory[idx]) return;
  window.open(openHistory[idx].url, "_blank");
  log("🔗 เปิดซ้ำ: "+openHistory[idx].brand+" ("+openHistory[idx].carId+")", "info");
}
</script>
</body>
</html>
